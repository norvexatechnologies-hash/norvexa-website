# Norvexa Technologies — nginx (managed in GitHub: ops/nginx-norvexa.conf, installed by ops/setup.sh)
server {
    listen 201.18.212.158:80;
    listen 80;
    server_name norvexatechnologies.com www.norvexatechnologies.com;
    location /.well-known/acme-challenge/ { root /var/www/redwhiteblueapps; }
    location / { return 301 https://www.norvexatechnologies.com$request_uri; }
}
server {
    listen 201.18.212.158:443 ssl;
    listen 443 ssl;
    http2 on;
    server_name norvexatechnologies.com;
    ssl_certificate /etc/letsencrypt/live/norvexatechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/norvexatechnologies.com/privkey.pem;
    location /.well-known/acme-challenge/ { root /var/www/redwhiteblueapps; }
    location / { return 301 https://www.norvexatechnologies.com$request_uri; }
}
server {
    listen 201.18.212.158:443 ssl;
    listen 443 ssl;
    http2 on;
    server_name www.norvexatechnologies.com;
    ssl_certificate /etc/letsencrypt/live/norvexatechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/norvexatechnologies.com/privkey.pem;

    root /var/www/norvexa;
    index index.html;
    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location /.well-known/acme-challenge/ { root /var/www/redwhiteblueapps; }

    # lead handler (PHP) — data and settings never served
    location ~ ^/api/(data/|config\.php) { return 404; }
    location ~ ^/api/[a-z0-9_-]+\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        add_header X-Robots-Tag "noindex" always;
    }
    location ~ /\.(?!well-known) { return 404; }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(png|jpg|jpeg|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ^~ /thank-you/ {
        add_header X-Robots-Tag "noindex" always;
        try_files $uri $uri/ =404;
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
